# Production / staging overrides. One stack per environment, selected with COMPOSE_PROJECT_NAME
# (alcom-prod / alcom-staging). The shared edge Nginx (TLS, deploy/edge/) reaches each stack
# over the external `edge` network using the per-stack aliases below.
#
# Images are tagged with the git commit. On pushes to main, CI builds them and pushes them to
# GHCR, and the Deploy workflow pulls them (`deploy.sh --pull`). A manual `deploy.sh` builds
# them on the server instead.

x-backend-prod: &backend-prod
  image: ${IMAGE_REGISTRY:-ghcr.io/george-kibe}/alcom-backend:${APP_VERSION:?set APP_VERSION}
  pull_policy: missing
  env_file: .env
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    restart: unless-stopped
    shm_size: 256mb
    logging: *logging

  redis:
    restart: unless-stopped
    logging: *logging

  backend:
    <<: *backend-prod
    build:
      context: ./backend
      target: prod
      args:
        APP_VERSION: ${APP_VERSION}
    volumes:
      - static:/app/staticfiles-shared
    command: >
      sh -c "cp -r /app/staticfiles/. /app/staticfiles-shared/ &&
             exec gunicorn config.wsgi:application -c gunicorn.conf.py"
    networks:
      default:
      edge:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-backend

  worker:
    <<: *backend-prod
    # The image's HTTP health check is for gunicorn; ask Celery itself instead.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3

  beat:
    <<: *backend-prod
    healthcheck:
      disable: true # scheduler has no endpoint to probe; restart policy covers crashes

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/george-kibe}/alcom-frontend-${DEPLOY_ENV:?set DEPLOY_ENV}:${APP_VERSION}
    pull_policy: missing
    build:
      context: ./frontend
      target: prod
      args:
        APP_VERSION: ${APP_VERSION}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:?set SITE_URL}
        NEXT_PUBLIC_SITE_ENV: ${SITE_ENV:?set SITE_ENV}
    restart: unless-stopped
    volumes:
      - next-cache:/app/.next/cache
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks:
      default:
      edge:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-frontend

volumes:
  static:
    name: ${COMPOSE_PROJECT_NAME}-static  # mounted read-only by the edge Nginx
  next-cache:

networks:
  edge:
    external: true
