name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_DB: alcom
          POSTGRES_USER: alcom
          POSTGRES_PASSWORD: alcom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alcom" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgis://alcom:alcom@localhost:5432/alcom
    steps:
      - uses: actions/checkout@v7
      - name: Install GeoDjango system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Validate OpenAPI schema
        run: uv run python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yaml
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Audit dependencies
        run: uv export --no-dev --no-hashes --format requirements-txt | uvx pip-audit -r /dev/stdin --strict

  frontend:
    name: Frontend (lint, types, tests, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Production images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    env:
      # Pushes to main publish the images the Deploy workflow ships; PRs only build them.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - name: Image names
        id: img
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: prod
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.img.outputs.registry }}/alcom-backend:${{ steps.img.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: APP_VERSION=${{ steps.img.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          target: prod
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.img.outputs.registry }}/alcom-frontend-prod:${{ steps.img.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # NEXT_PUBLIC_* values are baked into the bundle (repository variables).
          build-args: |
            APP_VERSION=${{ steps.img.outputs.version }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'https://alcomconsultants.co.ke' }}
            NEXT_PUBLIC_SITE_ENV=${{ vars.SITE_ENV || 'staging' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
