name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_DB: alcom
          POSTGRES_USER: alcom
          POSTGRES_PASSWORD: alcom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alcom" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgis://alcom:alcom@localhost:5432/alcom
    steps:
      - uses: actions/checkout@v7
      - name: Install GeoDjango system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Validate OpenAPI schema
        run: uv run python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yaml
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Frontend API types are up to date (run `make api-types` if this fails)
        run: |
          npx --yes openapi-typescript@7.13.0 /tmp/schema.yaml -o /tmp/schema.d.ts
          diff -u ../frontend/lib/api/schema.d.ts /tmp/schema.d.ts
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Audit dependencies
        run: uv export --no-dev --no-hashes --format requirements-txt | uvx pip-audit -r /dev/stdin --strict

  frontend:
    name: Frontend (lint, types, tests, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10 # a stalled download/apt mirror once hung CI for an hour
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (full stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    env:
      E2E_FULLSTACK: "1"
      E2E_BASE_URL: http://localhost:8080
      E2E_STAFF_EMAIL: e2e-staff@alcom.test
      E2E_STAFF_PASSWORD: e2e-Staff-pass-2026
      # Uploads to Cloudinary are mocked with responses signed by this test-only secret.
      E2E_CLOUDINARY_SECRET: e2e-secret
      E2E_CLOUDINARY_FOLDER: alcom/dev/properties
    steps:
      - uses: actions/checkout@v7
      - name: Development environment
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci$(openssl rand -hex 12)|" .env
          sed -i "s|^DJANGO_SECRET_KEY=.*|DJANGO_SECRET_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^CLOUDINARY_URL=.*|CLOUDINARY_URL=cloudinary://e2e-key:$E2E_CLOUDINARY_SECRET@e2e-cloud|" .env
      - name: Start the stack
        timeout-minutes: 15
        run: |
          # The dev containers run as uid 1000 (node / app); the runner checks out as 1001.
          sudo chown -R 1000:1000 frontend backend
          docker compose up -d --build --wait db redis backend
          docker compose up -d frontend nginx
          # next dev compiles pages on first request; warm them up before the tests.
          for path in /api/v1/health/ /dashboard/login /dashboard/security; do
            code=000
            for _ in $(seq 1 60); do
              code=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' "$E2E_BASE_URL$path" || true)
              case "$code" in 200|307) break ;; esac
              sleep 3
            done
            echo "$path -> $code"
            if [ "$code" != 200 ] && [ "$code" != 307 ]; then
              docker compose ps
              docker compose logs --tail=100 frontend nginx backend
              exit 1
            fi
          done
      - name: Staff account for the tests
        run: |
          docker compose exec -T backend python manage.py shell -c "
          from apps.accounts.models import User
          User.objects.create_user('$E2E_STAFF_EMAIL', '$E2E_STAFF_PASSWORD', is_staff=True, first_name='E2E')"
      - name: Demo listings for the public pages
        run: docker compose exec -T backend python manage.py seed_demo_listings
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Give the checkout back to the runner user
        run: sudo chown -R "$(id -u):$(id -g)" frontend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10 # a stalled download/apt mirror once hung CI for an hour
        working-directory: frontend
      - run: npx playwright test e2e/dashboard.spec.ts e2e/dashboard-listings.spec.ts e2e/dashboard-photos.spec.ts e2e/public-listings.spec.ts e2e/blog.spec.ts e2e/visitor-account.spec.ts e2e/enquiries.spec.ts
        working-directory: frontend
      - name: Service logs
        if: failure()
        run: docker compose logs --tail=200 backend frontend nginx
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-fullstack
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Production images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    env:
      # Pushes to main publish the images the Deploy workflow ships; PRs only build them.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - name: Image names
        id: img
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: prod
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.img.outputs.registry }}/alcom-backend:${{ steps.img.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: APP_VERSION=${{ steps.img.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          target: prod
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.img.outputs.registry }}/alcom-frontend-prod:${{ steps.img.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # NEXT_PUBLIC_* values are baked into the bundle (repository variables).
          build-args: |
            APP_VERSION=${{ steps.img.outputs.version }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'https://alcomconsultants.co.ke' }}
            NEXT_PUBLIC_SITE_ENV=${{ vars.SITE_ENV || 'staging' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
