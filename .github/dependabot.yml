version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-minor: { update-types: [minor, patch] }
    ignore:
      - dependency-name: django  # major upgrades are planned deliberately (6.1 -> 6.2 LTS is allowed)
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-minor: { update-types: [minor, patch] }
    ignore:
      # Majors blocked until the toolchain supports them — re-check when Next.js upgrades.
      - dependency-name: eslint             # eslint-config-next plugins need ESLint 9
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript         # typescript-eslint does not support TS 7 yet
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"      # must match the Node 24 LTS runtime
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
