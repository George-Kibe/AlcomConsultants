# Development reverse proxy: mirrors production routing (same origin, API under /api).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend { server frontend:3000; }
upstream backend  { server backend:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    location /api/          { include /etc/nginx/snippets/proxy.conf; proxy_pass http://backend; }
    location /django-admin/ { include /etc/nginx/snippets/proxy.conf; proxy_pass http://backend; }
    location /static/       { include /etc/nginx/snippets/proxy.conf; proxy_pass http://backend; }

    # Everything else (pages + HMR websocket) goes to Next.js
    location / { include /etc/nginx/snippets/proxy.conf; proxy_pass http://frontend; }
}
