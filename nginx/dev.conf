# Development reverse proxy: mirrors production routing (same origin, API under /api).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # Re-resolve service names via Docker DNS so recreated containers (new IPs) don't cause 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend http://frontend:3000;
    set $backend  http://backend:8000;

    location /api/          { include /etc/nginx/snippets/proxy.conf; proxy_pass $backend; }
    location /django-admin/ { include /etc/nginx/snippets/proxy.conf; proxy_pass $backend; }
    location /static/       { include /etc/nginx/snippets/proxy.conf; proxy_pass $backend; }

    # Everything else (pages + HMR websocket) goes to Next.js
    location / { include /etc/nginx/snippets/proxy.conf; proxy_pass $frontend; }
}
