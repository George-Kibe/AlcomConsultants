[project]
name = "alcom-backend"
version = "0.1.0"
description = "Alcom Consultants Limited — API"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=6.1.1,<6.2",               # move to 6.2 LTS when released (April 2027)
    "djangorestframework>=3.18.1",
    "django-filter>=26.1",
    "drf-spectacular>=0.30.0",
    "django-environ>=0.14.0",
    "django-redis>=7.0.0",
    "psycopg[binary,pool]>=3.3.6",
    "celery[redis]>=5.6.3",
    "gunicorn>=26.2.0",
    "sentry-sdk[django,celery]>=2.71.0",
    "cloudinary>=1.46.2",
    "django-allauth[mfa]>=65.19.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-cov>=7.1.0",
    "factory-boy>=3.3.3",
    "ruff>=0.16.9",
    "mypy>=2.3.1",
    "django-stubs[compatible-mypy]>=6.1.1,<6.2",
    "djangorestframework-stubs>=3.18.1",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "DJ",            # flake8-django
    "S",             # bandit (security)
    "SIM", "C4", "RUF", "PTH", "T20",
]
ignore = ["RUF012"]  # mutable class attrs are idiomatic in Django Meta/DRF

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"config/settings/*.py" = ["F405"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["*.tests.*", "conftest"]
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--ds=config.settings.test --strict-markers --reuse-db -p no:cacheprovider"
filterwarnings = [
    "error::DeprecationWarning",  # surface Django 7.0 deprecations early
    "error::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["apps", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "config/wsgi.py",
    "config/asgi.py",
    "config/settings/dev.py",
    "config/settings/prod.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
